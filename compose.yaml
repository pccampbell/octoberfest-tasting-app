services:
  tasting:
    build: .
    ports:
      - '${HOST_BIND:-0.0.0.0}:${APP_PORT:-8090}:8090'
    environment:
      PUBLIC_APP_URL: '${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env to a guest-accessible address}'
      GOMEMLIMIT: 256MiB
    volumes:
      - tasting_data:/app/pb_data
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  tasting_data:
