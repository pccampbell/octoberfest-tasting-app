# Use alongside compose.yaml; the regular laptop configuration is unchanged.
services:
  tasting:
    ports: !override
      - '127.0.0.1:${APP_PORT:-8090}:8090'

  public-gateway:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    ports:
      - '127.0.0.1:8095:80'
    volumes:
      - ./deploy/public-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tasting:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
