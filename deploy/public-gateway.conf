# Only the guest app's API is reachable through the public tunnel.
# $uri is normalized by Nginx before matching, including percent-encoded paths.
map $uri $public_route {
    default 1;
    ~^/api/(health|tasting/config|realtime)/?$ 1;
    ~^/api/collections/guests/(auth-with-password|auth-refresh)/?$ 1;
    ~^/api/collections/(guests|beers|ratings|beer_results|party_stats)/records(/[^/]+)?/?$ 1;
    ~^/api/files/[^/]+/[^/]+/[^/]+$ 1;
    ~^/_ 0;
    ~^/api(/|$) 0;
}

# Cloudflare supplies the visitor address; local checks use their socket address.
map $http_cf_connecting_ip $visitor_ip {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}

# Follow Docker DNS when the app container is recreated during an update.
upstream tasting_backend {
    zone tasting_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server tasting:8090 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    if ($public_route = 0) { return 404; }

    location / {
        proxy_pass http://tasting_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $visitor_ip;
        proxy_set_header X-Forwarded-For $visitor_ip;
        proxy_set_header X-Forwarded-Proto https;
        # PocketBase live results use server-sent events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }
}
